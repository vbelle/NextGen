services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      NEXTGEN_APP_PASSWORD: ${NEXTGEN_APP_PASSWORD}
      NEXTGEN_CREDENTIAL_KEY: ${NEXTGEN_CREDENTIAL_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      NEXTGEN_DB_PATH: /data/nextgen.db
      NEXTGEN_EMBEDDING_MODEL: ${NEXTGEN_EMBEDDING_MODEL:-nomic-embed-text}
      NEXTGEN_VECTOR_STORE_PATH: /data/vector_stores
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      INTERVIEW_VAULT_PATH: ${INTERVIEW_VAULT_PATH:-/data/interview_vault}
      OBSIDIAN_VAULT_PATH: ${OBSIDIAN_VAULT_PATH:-/data/obsidian_vault}
    volumes:
      - nextgen-data:/data
      - ${HOST_INTERVIEW_PATH:-/tmp/interview}:/data/interview_vault:ro
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  nextgen-data:
  ollama-data:
